[package]
name = "deepseek-ultrafast-strix"
edition.workspace = true
version.workspace = true

[features]
# Runtime-loaded C ABI shim; ordinary Vulkan builds need no ATen SDK or DLLs.
native-aten = []
native-serve = ["native-aten", "dep:axum", "dep:tokio", "dep:tokio-stream", "dep:futures-core"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
memmap2.workspace = true
half.workspace = true
tokenizers.workspace = true
safetensors = "0.8"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time", "io-util"], optional = true }
tokio-stream = { version = "0.1", optional = true }
futures-core = { version = "0.3", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "strix"
path = "src/main.rs"
